name: Fix assurance table visibility

on:
  push:
    paths:
      - '.github/workflows/fix-assurance-table-visibility.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Shyena column visible and highlighted
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()

          old_header = '<th className="w-[300px] bg-primary/[0.07] px-5 py-4 font-semibold text-primary">Shyena assurance system</th>'
          new_header = '<th className="sticky right-0 z-20 w-[300px] bg-violet-50 px-5 py-4 font-semibold text-primary shadow-[-8px_0_18px_-12px_rgba(15,23,42,0.35)]">Shyena assurance system</th>'

          old_cell = '<td className="bg-primary/[0.055] px-5 py-4 font-medium leading-relaxed">{shyena}</td>'
          new_cell = '<td className="sticky right-0 z-20 bg-violet-50 px-5 py-4 font-medium leading-relaxed text-slate-900 shadow-[-8px_0_18px_-12px_rgba(15,23,42,0.28)]">{shyena}</td>'

          if old_header not in s:
              raise SystemExit('Expected Shyena table header not found')
          if old_cell not in s:
              raise SystemExit('Expected Shyena table cell not found')

          s = s.replace(old_header, new_header, 1)
          s = s.replace(old_cell, new_cell, 1)
          p.write_text(s)
          PY

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/index.tsx .github/workflows/fix-assurance-table-visibility.yml
          git commit -m 'Highlight Shyena assurance column [skip ci]'
          git rm .github/workflows/fix-assurance-table-visibility.yml
          git commit -m 'Remove one-shot table fix workflow [skip ci]'
          git push
