name: Repository Lint Remediation

on:
  push:
    branches:
      - fix/repository-wide-lint
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/repository-lint-autofix.yml"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.json"
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: repository-lint-remediation-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  remediate-and-verify:
    if: startsWith(github.head_ref || github.ref_name, 'fix/repository-wide-lint')
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply safe ESLint and Prettier fixes
        run: npx eslint . --fix

      - name: Commit automated fixes to this branch
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply repository-wide lint fixes"
            git push origin "HEAD:${BRANCH_NAME}"
          else
            echo "No automatic ESLint/Prettier fixes were needed."
          fi

      - name: Verify lint
        run: npm run lint

      - name: Validate public content
        run: npm run content:validate

      - name: Verify production build
        run: npm run build
