name: Patch contact form validation focus

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch contact form
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/routes/contact.tsx')
          text = path.read_text()

          old = '''  async function handleSubmit(event: FormEvent<HTMLFormElement>) {\n    event.preventDefault(); setError(\"\");\n    const form = event.currentTarget; const formData = new FormData(form);\n    const emailValidation = getEmailError(String(formData.get(\"email\") ?? \"\"));\n    if (emailValidation) { setEmailError(emailValidation); return; }\n    setEmailError(\"\");\n    const requiredFields = [\"inquiryReason\", \"company\", \"firstName\", \"lastName\", \"email\", \"phone\", \"jobTitle\", \"companySize\", \"country\", \"message\"];\n    if (requiredFields.some((field) => !String(formData.get(field) ?? \"\").trim())) { setError(\"Please complete every field before submitting.\"); return; }\n'''

          new = '''  function focusInvalidField(field: string) {\n    const element = document.getElementById(field);\n    if (!element) return;\n    element.scrollIntoView({ behavior: \"smooth\", block: \"center\" });\n    window.setTimeout(() => {\n      (element as HTMLElement).focus({ preventScroll: true });\n    }, 350);\n  }\n\n  async function handleSubmit(event: FormEvent<HTMLFormElement>) {\n    event.preventDefault(); setError(\"\");\n    const form = event.currentTarget; const formData = new FormData(form);\n    const emailValidation = getEmailError(String(formData.get(\"email\") ?? \"\"));\n    if (emailValidation) {\n      setEmailError(emailValidation);\n      focusInvalidField(\"email\");\n      return;\n    }\n    setEmailError(\"\");\n    const requiredFields = [\"inquiryReason\", \"company\", \"firstName\", \"lastName\", \"email\", \"phone\", \"jobTitle\", \"companySize\", \"country\", \"message\"];\n    const firstMissingField = requiredFields.find((field) => !String(formData.get(field) ?? \"\").trim());\n    if (firstMissingField) {\n      setError(\"Please complete every field before submitting.\");\n      focusInvalidField(firstMissingField);\n      return;\n    }\n'''

          if old not in text:
              raise SystemExit('Expected contact form block was not found; aborting without changes.')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/contact.tsx .github/workflows/patch-contact-validation-focus.yml
          git rm .github/workflows/patch-contact-validation-focus.yml
          git commit -m "Focus first invalid contact form field on submit"
          git push
