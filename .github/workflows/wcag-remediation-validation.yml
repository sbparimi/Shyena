name: WCAG remediation validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wcag-remediation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies (locked)
        run: bun install --frozen-lockfile

      - name: Validate theme contract
        run: node scripts/validate-theme-contract.mjs

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
