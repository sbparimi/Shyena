name: Render Hero Video

# Render the branded Remotion video on GitHub Actions and commit the static
# result. Vercel only serves the resulting MP4 and does not render video.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "remotion/src/**"
      - "remotion/public/**"
      - "remotion/scripts/**"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install remotion dependencies
        working-directory: remotion
        run: bun install

      - name: Ensure Chrome runtime libraries are present
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64 || true

      - name: Generate original Shyena soundtrack
        working-directory: remotion
        run: node scripts/generate-soundtrack.mjs

      - name: Render branded hero video with soundtrack
        working-directory: remotion
        run: node scripts/render-remotion.mjs

      - name: Commit rendered video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/hero-video.mp4
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Render branded hero video with original soundtrack (automated)"
            git push
          fi
