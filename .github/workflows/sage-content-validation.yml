name: SAGE Content Validation

on:
  pull_request:
    paths:
      - "content/**"
      - "src/lib/sage/**"
      - "scripts/validate-sage-content.mjs"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  content-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/validate-sage-content.mjs
      - run: pnpm build
