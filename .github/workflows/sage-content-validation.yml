name: SAGE Content Validation

on:
  pull_request:
    paths:
      - "content/**"
      - "src/content/docs/**"
      - "src/components/docs/doc-concept-visual.tsx"
      - "public/rag-*.svg"
      - "src/lib/sage/**"
      - "scripts/validate-sage-content.mjs"
      - "package.json"
      - ".github/workflows/sage-content-validation.yml"

jobs:
  content-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Validate public content
        run: npm run content:validate
      - name: Build production site
        run: npm run build
