name: SAGE Content CI

on:
  push:
    branches: [main, 'feat/**', 'sage/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply products section redesign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          if 'Understand, test, and defend your AI agents before release.' in s:
              print('Products section already updated')
          else:
              pattern = r'      <section className="bg-\[#f7f8fb\]">.*?</section>\n\n      <section id="how-it-works"'
              replacement = '''      <section className="bg-white">
        <div className="mx-auto max-w-7xl px-6 py-20 lg:px-8 lg:py-24">
          <div className="max-w-5xl">
            <h2 className="font-[Sora] text-[clamp(3rem,5vw,5.5rem)] font-normal leading-[1.02] tracking-[-0.045em] text-slate-950">
              Understand, test, and defend your AI agents before release.
            </h2>
          </div>
          <div className="mt-10 rounded-[8px] border-2 border-[#08a995] p-4 sm:p-5 lg:mt-12">
            <div className="grid gap-4 md:grid-cols-3">
              {products.map((product) => {
                const Icon = product.icon;
                return (
                  <Link key={product.name} to={product.href} className="group flex min-h-[330px] flex-col border border-slate-300 bg-white p-7 transition-colors duration-200 hover:border-[#08a995]">
                    <div className="flex items-start justify-between gap-5">
                      <div className={`flex h-12 w-12 items-center justify-center rounded-full ${product.accent}`}><Icon className="h-5 w-5" /></div>
                      <ArrowRight className="h-5 w-5 text-slate-900 transition-transform duration-200 group-hover:translate-x-1" />
                    </div>
                    <div className="mt-9 text-xs font-semibold tracking-[0.2em] text-slate-400">{product.name} · {product.stage}</div>
                    <h3 className="mt-4 max-w-md text-2xl font-semibold leading-tight tracking-tight text-slate-950">{product.title}</h3>
                    <p className="mt-5 text-[15px] leading-7 text-slate-600">{product.description}</p>
                  </Link>
                );
              })}
            </div>
          </div>
          <Link to="/pricing" className="mt-5 inline-flex items-center gap-3 border-2 border-[#08a995] px-5 py-3 text-base font-semibold text-slate-950 transition-colors hover:bg-[#08a995] hover:text-white">
            Explore the Shyena platform <span className="inline-flex h-7 w-7 items-center justify-center bg-[#ffb703] text-slate-950"><ArrowRight className="h-4 w-4" /></span>
          </Link>
        </div>
      </section>

      <section id="how-it-works"'''
              out, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Expected one old products section, found {n}')
              p.write_text(out)

      - name: Install dependencies
        run: npm install
      - name: Validate content contract
        run: npm run content:validate
      - name: Generate content registry
        run: npm run content:generate
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit redesign and remove temporary workflows
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if grep -q 'Understand, test, and defend your AI agents before release.' src/routes/index.tsx; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/routes/index.tsx
            git rm -f .github/workflows/update-products-section.yml || true
            git commit -m 'Redesign assurance products section' || true
            git push
          fi