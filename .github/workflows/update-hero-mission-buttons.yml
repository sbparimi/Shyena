name: Update hero mission and CTAs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update hero
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          old = '''          <div className="flex items-center">
            <h1 className="max-w-2xl font-[Sora] text-[clamp(3.5rem,5.5vw,5.5rem)] font-extrabold leading-[0.94] tracking-[-0.045em] text-slate-950">AI built for your enterprise. <br /><span className="text-slate-500">Assurance that proves it is ready.</span></h1>
          </div>
          <AssuranceVideo />'''
          new = '''          <div className="flex flex-col items-start justify-center">
            <h1 className="max-w-2xl font-[Sora] text-[clamp(3.5rem,5.5vw,5.5rem)] font-extrabold leading-[0.94] tracking-[-0.045em] text-slate-950">Agentic AI Evaluation built for enterprises.</h1>
            <div className="mt-10 flex flex-col gap-4 sm:flex-row sm:flex-wrap">
              <Link to="/contact" data-shyena-button="primary" className="inline-flex h-14 items-center justify-center gap-3 rounded-full border border-[#ffb703] bg-[#ffb703] px-8 text-[15px] font-extrabold uppercase tracking-[0.01em] text-slate-950 transition-all duration-200 hover:bg-[#f5a900]">Talk to an Assurance Expert <ArrowRight className="h-5 w-5" /></Link>
              <a href="#how-it-works" data-shyena-button="secondary" className="inline-flex h-14 items-center justify-center gap-3 rounded-full border-2 border-[#ffb703] bg-white px-8 text-[15px] font-semibold text-slate-950 transition-all duration-200 hover:bg-amber-50"><Play className="h-5 w-5" /> See how Shyena works</a>
            </div>
          </div>
          <AssuranceVideo />'''
          if old not in s:
              raise SystemExit('Expected hero block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Verify hero
        run: |
          grep -q 'Agentic AI Evaluation built for enterprises.' src/routes/index.tsx
          grep -q 'Talk to an Assurance Expert' src/routes/index.tsx
          grep -q 'See how Shyena works' src/routes/index.tsx
          ! grep -q 'NEXUS · UNDERSTAND' src/routes/index.tsx

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/update-hero-mission-buttons.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/index.tsx .github/workflows/update-hero-mission-buttons.yml
          git commit -m 'Set hero mission and restore CTAs'
          git push origin main