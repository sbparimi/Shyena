name: Simplify hero to mission statement

on:
  push:
    paths:
      - '.github/workflows/update-hero-mission.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace hero copy with mission statement only
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/routes/index.tsx')
          text = path.read_text()

          pattern = re.compile(
              r'''\n          <div>\n            <div className="inline-flex items-center gap-2 rounded-full border border-orange-200 bg-white/75 px-3.5 py-2 text-\[11px\] font-bold uppercase tracking-\[0.18em\] text-orange-700 shadow-sm"><span className="h-1.5 w-1.5 rounded-full bg-orange-500" /> Enterprise AI assurance</div>\n            <h1 className="mt-7 max-w-2xl font-\[Sora\] text-\[clamp\(3.75rem,5.8vw,5.5rem\)\] font-extrabold leading-\[0.94\] tracking-\[-0.045em\] text-slate-950">AI built for your enterprise\. <br /><span className="text-slate-500">Assurance that proves it is ready\.</span></h1>\n            <p className="mt-7 max-w-xl text-lg leading-8 text-slate-600 sm:text-xl">Shyena gives enterprise teams one assurance layer to understand AI agents, test real behavior, expose security risk, and make evidence-backed release decisions\.</p>\n            <div className="mt-9 flex flex-wrap gap-3">\n              <Link to="/contact" data-shyena-button="primary" className="inline-flex h-12 items-center justify-center gap-2 rounded-full border px-7 text-\[14px\] font-extrabold uppercase tracking-\[0.01em\] transition-all duration-200">Talk to an assurance expert <ArrowRight className="h-4 w-4" /></Link>\n              <a href="#how-it-works" data-shyena-button="secondary" className="inline-flex h-12 items-center justify-center gap-2 rounded-full border px-7 text-\[14px\] font-semibold transition-all duration-200"><Play className="h-4 w-4" /> See how Shyena works</a>\n            </div>\n            <div className="mt-10 flex flex-wrap items-center gap-x-6 gap-y-3 text-xs font-semibold uppercase tracking-\[0.16em\] text-slate-400"><span>NEXUS · Understand</span><span>VERA · Evaluate</span><span>CHAKRA · Defend</span></div>\n          </div>\n          <AssuranceVideo />''',
              re.MULTILINE,
          )

          replacement = '''\n          <div className="flex items-center">\n            <h1 className="max-w-2xl font-[Sora] text-[clamp(3.5rem,5.5vw,5.5rem)] font-extrabold leading-[0.94] tracking-[-0.045em] text-slate-950">AI built for your enterprise. <br /><span className="text-slate-500">Assurance that proves it is ready.</span></h1>\n          </div>\n          <AssuranceVideo />'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Expected hero block was not found; no changes made.')

          path.write_text(updated)

      - name: Verify hero contains only mission statement text
        shell: bash
        run: |
          grep -F 'AI built for your enterprise.' src/routes/index.tsx
          grep -F 'Assurance that proves it is ready.' src/routes/index.tsx
          if grep -F 'Enterprise AI assurance' src/routes/index.tsx; then exit 1; fi
          if grep -F 'Talk to an assurance expert' src/routes/index.tsx; then exit 1; fi
          if grep -F 'Shyena gives enterprise teams one assurance layer' src/routes/index.tsx; then exit 1; fi

      - name: Commit hero update and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/index.tsx
          git commit -m 'Make homepage hero mission statement only'
          git rm .github/workflows/update-hero-mission.yml
          git commit -m 'Remove temporary hero update workflow'
          git push