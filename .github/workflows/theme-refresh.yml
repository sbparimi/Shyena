name: Apply Shyena visual theme

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/theme-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply image-derived Shyena palette
        run: |
          python - <<'PY'
          from pathlib import Path

          BG = '#0a071d'
          CARD = '#15102d'
          PURPLE = '#7c3aed'
          MAGENTA = '#a855f7'
          ORANGE = '#f59804'
          WHITE = '#faf8ff'
          MUTED = '#c9c4d8'
          BORDER = '#2b2350'

          # Comparison table: dark canvas, purple Shyena column, orange accent labels.
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          replacements = {
            'border-y border-border bg-secondary/45': f'border-y border-[#2b2350] bg-[{BG}] text-[#faf8ff]',
            'border-primary/20 bg-card shadow-elevated': f'border-[#7c3aed]/35 bg-[{CARD}] shadow-elevated',
            'border-b border-border bg-background': f'border-b border-[#2b2350] bg-[{BG}]',
            'sticky left-0 z-10 w-[190px] bg-background': f'sticky left-0 z-10 w-[190px] bg-[{BG}]',
            'w-[210px] px-5 py-4 font-semibold': f'w-[210px] px-5 py-4 font-semibold text-[#faf8ff]',
            'sticky right-0 z-20 w-[300px] bg-violet-50 px-5 py-4 font-semibold text-primary shadow-[-8px_0_18px_-12px_rgba(15,23,42,0.35)]': f'sticky right-0 z-20 w-[300px] border-l-2 border-[#a855f7] bg-[#7c3aed] px-5 py-4 font-bold text-[#faf8ff] shadow-[-10px_0_24px_-14px_rgba(168,85,247,0.65)]',
            'border-b border-border align-top': f'border-b border-[#2b2350] align-top',
            'sticky left-0 z-10 bg-card px-5 py-4 font-semibold': f'sticky left-0 z-10 bg-[#15102d] px-5 py-4 font-semibold text-[#faf8ff]',
            'px-5 py-4 leading-relaxed text-muted-foreground': f'px-5 py-4 leading-relaxed text-[#c9c4d8]',
            'sticky right-0 z-20 bg-violet-50 px-5 py-4 font-medium leading-relaxed text-slate-900 shadow-[-8px_0_18px_-12px_rgba(15,23,42,0.28)]': f'sticky right-0 z-20 border-l-2 border-[#a855f7] bg-[#7c3aed] px-5 py-4 font-semibold leading-relaxed text-[#faf8ff] shadow-[-10px_0_24px_-14px_rgba(168,85,247,0.55)]',
            'border-t border-border bg-secondary/35': f'border-t border-[#2b2350] bg-[#15102d]',
            'rounded-xl border border-border bg-card': f'rounded-xl border border-[#2b2350] bg-[#15102d]',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)

          # Pricing page: use the same dark navy/purple/orange system throughout.
          p = Path('src/routes/pricing.tsx')
          s = p.read_text()
          replacements = {
            'bg-slate-50': f'bg-[{BG}]',
            'bg-white': f'bg-[{CARD}]',
            'bg-slate-950': f'bg-[{BG}]',
            'border-slate-200': f'border-[{BORDER}]',
            'border-slate-300': f'border-[#514778]',
            'border-slate-700': f'border-[#514778]',
            'text-slate-950': f'text-[{WHITE}]',
            'text-slate-900': f'text-[{WHITE}]',
            'text-slate-700': f'text-[#e9e5f2]',
            'text-slate-600': f'text-[{MUTED}]',
            'text-slate-500': f'text-[#918aa8]',
            'text-slate-400': f'text-[#a9a2bd]',
            'text-slate-300': f'text-[#c9c4d8]',
            'text-violet-600': f'text-[#f59804]',
            'text-violet-700': f'text-[#a855f7]',
            'text-violet-300': f'text-[#a855f7]',
            'text-violet-400': f'text-[#a855f7]',
            'bg-violet-100': f'bg-[#7c3aed]/15',
            'bg-violet-600': f'bg-[#7c3aed]',
            'bg-violet-700/20': f'bg-[#7c3aed]/20',
            'focus:border-violet-500': f'focus:border-[#a855f7]',
            'focus:ring-violet-100': f'focus:ring-[#7c3aed]/20',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Plans area and informational cards should inherit the dark canvas explicitly.
          s = s.replace('id="plans" className="mx-auto max-w-7xl', f'id="plans" className="bg-[{BG}] mx-auto max-w-7xl')
          s = s.replace('rounded-3xl border p-7 ${plan.featured ? "border-violet-500 bg-[#0a071d] text-white shadow-2xl shadow-violet-200/50" : "border-[#2b2350] bg-[#15102d]"}', 'rounded-3xl border p-7 ${plan.featured ? "border-[#a855f7] bg-[#15102d] text-[#faf8ff] shadow-2xl shadow-[#7c3aed]/30" : "border-[#2b2350] bg-[#15102d]"}')
          s = s.replace('border-y border-slate-200 bg-[#0a071d]', f'border-y border-[#2b2350] bg-[{BG}]')
          s = s.replace('bg-[#0a071d] p-6 text-white', f'bg-[{CARD}] p-6 text-[#faf8ff]')
          p.write_text(s)
          PY

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/routes/pricing.tsx
          git commit -m "Apply Shyena comparison and pricing visual theme [skip ci]"
          git rm .github/workflows/theme-refresh.yml
          git commit -m "Remove one-shot theme workflow [skip ci]"
          git push
