name: Update platform section style

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restyle platform section
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/routes/index.tsx")
          s = p.read_text()
          if 'One AI agent. <span className="font-extrabold">Three assurance layers.</span>' in s and 'border-2 border-[#08a89a]' in s:
              raise SystemExit("Section already updated")
          start = s.index('      <section className="bg-[#f7f8fb]"><div className="mx-auto max-w-7xl px-6 py-20 lg:px-8 lg:py-24"><div className="flex flex-col justify-between gap-6 lg:flex-row lg:items-end"><div className="max-w-3xl"><div className="text-xs font-bold uppercase tracking-[0.2em] text-violet-600">One AI agent. Three assurance layers.</div>')
          end = s.index('      <section id="how-it-works"', start)
          replacement = '''      <section className="bg-white">
        <div className="mx-auto max-w-7xl px-6 py-20 lg:px-8 lg:py-24">
          <div className="max-w-5xl">
            <h2 className="font-[Sora] text-4xl font-normal leading-[1.15] tracking-[-0.035em] text-slate-950 sm:text-5xl lg:text-[4rem]">
              One AI agent. <span className="font-extrabold">Three assurance layers.</span>
            </h2>
          </div>
          <div className="mt-12 rounded-[8px] border-2 border-[#08a89a] p-4 sm:p-5 lg:p-6">
            <div className="grid gap-4 lg:grid-cols-3">
              {products.map(product => (
                <Link
                  key={product.name}
                  to={product.href}
                  className="group flex min-h-[300px] flex-col border border-slate-200 bg-white p-7 transition-colors duration-200 hover:border-[#08a89a] sm:p-8"
                >
                  <div className="flex items-start justify-between gap-4">
                    <div className={`flex h-11 w-11 items-center justify-center rounded-2xl ${product.accent}`}>
                      {(() => { const Icon = product.icon; return <Icon className="h-5 w-5" />; })()}
                    </div>
                    <ArrowRight className="h-5 w-5 text-slate-900 transition group-hover:translate-x-1" />
                  </div>
                  <div className="mt-8 text-xs font-bold uppercase tracking-[0.2em] text-slate-400">{product.name} · {product.stage}</div>
                  <h3 className="mt-4 text-2xl font-semibold leading-tight tracking-tight text-slate-950">{product.title}</h3>
                  <p className="mt-4 text-[15px] leading-7 text-slate-600">{product.description}</p>
                </Link>
              ))}
            </div>
          </div>
          <div className="mt-8 flex justify-start">
            <Link to="/pricing" className="inline-flex items-center gap-3 border-2 border-[#08a89a] px-5 py-3 text-base font-semibold text-slate-950 transition-colors hover:bg-[#08a89a] hover:text-white">
              View platform pricing <ArrowRight className="h-5 w-5" />
            </Link>
          </div>
        </div>
      </section>\n\n'''
          p.write_text(s[:start] + replacement + s[end:])

      - name: Verify
        shell: bash
        run: |
          grep -q 'One AI agent. <span className="font-extrabold">Three assurance layers.</span>' src/routes/index.tsx
          grep -q 'border-2 border-\[#08a89a\]' src/routes/index.tsx
          grep -q 'View platform pricing' src/routes/index.tsx
          grep -q '<section id="how-it-works"' src/routes/index.tsx

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          git commit -m "Restyle platform assurance section"
          rm .github/workflows/update-platform-section-style.yml
          git add .github/workflows/update-platform-section-style.yml
          git commit -m "Remove temporary platform section workflow"
          git push
