<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">RAG failure routing</title><desc id="desc">Observed failure signals route to the earliest responsible system layer: source absent to ingestion, source not retrieved to retrieval, conflicting sources to context resolution, unsupported claims to verification and generation, and hostile content to security controls.</desc>
<defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#e2e8f0" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="430" rx="22" fill="#fffdf8"/><rect width="1200" height="430" rx="22" fill="url(#grid)"/>
<text x="36" y="42" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#7c3aed" letter-spacing="2">FAILURE TRIAGE / FIND THE EARLIEST DIVERGENCE</text>
<g font-family="Inter,system-ui,sans-serif" font-size="14" fill="#172033">
<rect x="38" y="90" width="230" height="62" rx="12" fill="#fff" stroke="#64748b" stroke-width="1.5"/><text x="153" y="116" text-anchor="middle" font-weight="700">Required source absent</text><text x="153" y="136" text-anchor="middle" font-size="12" fill="#667085">index never had the evidence</text>
<rect x="310" y="90" width="230" height="62" rx="12" fill="#fff8df" stroke="#d99a00" stroke-width="1.5"/><text x="425" y="116" text-anchor="middle" font-weight="700">Ingestion / index</text><text x="425" y="136" text-anchor="middle" font-size="12" fill="#667085">parse · chunk · metadata</text>
<rect x="38" y="177" width="230" height="62" rx="12" fill="#fff" stroke="#64748b" stroke-width="1.5"/><text x="153" y="203" text-anchor="middle" font-weight="700">Source not retrieved</text><text x="153" y="223" text-anchor="middle" font-size="12" fill="#667085">available but not selected</text>
<rect x="310" y="177" width="230" height="62" rx="12" fill="#fff8df" stroke="#d99a00" stroke-width="1.5"/><text x="425" y="203" text-anchor="middle" font-weight="700">Retrieval</text><text x="425" y="223" text-anchor="middle" font-size="12" fill="#667085">query · filters · rerank</text>
<rect x="38" y="264" width="230" height="62" rx="12" fill="#fff" stroke="#64748b" stroke-width="1.5"/><text x="153" y="290" text-anchor="middle" font-weight="700">Conflicting versions</text><text x="153" y="310" text-anchor="middle" font-size="12" fill="#667085">both sources retrieved</text>
<rect x="310" y="264" width="230" height="62" rx="12" fill="#fff8df" stroke="#d99a00" stroke-width="1.5"/><text x="425" y="290" text-anchor="middle" font-weight="700">Context resolution</text><text x="425" y="310" text-anchor="middle" font-size="12" fill="#667085">authority · version policy</text>
<rect x="590" y="90" width="250" height="62" rx="12" fill="#fff" stroke="#64748b" stroke-width="1.5"/><text x="715" y="116" text-anchor="middle" font-weight="700">Unsupported claim</text><text x="715" y="136" text-anchor="middle" font-size="12" fill="#667085">answer exceeds evidence</text>
<rect x="880" y="90" width="280" height="62" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="1020" y="116" text-anchor="middle" font-weight="700">Claim verifier + generator</text><text x="1020" y="136" text-anchor="middle" font-size="12" fill="#667085">grounding · contradiction · abstain</text>
<rect x="590" y="177" width="250" height="62" rx="12" fill="#fff5f5" stroke="#dc2626" stroke-width="1.5"/><text x="715" y="203" text-anchor="middle" font-weight="700">Hostile retrieved content</text><text x="715" y="223" text-anchor="middle" font-size="12" fill="#667085">instructions inside untrusted data</text>
<rect x="880" y="177" width="280" height="62" rx="12" fill="#fff5f5" stroke="#dc2626" stroke-width="1.5"/><text x="1020" y="203" text-anchor="middle" font-weight="700">Security boundary</text><text x="1020" y="223" text-anchor="middle" font-size="12" fill="#667085">isolation · tool policy · block</text>
<path d="M268 121H310M268 208H310M268 295H310M840 121H880M840 208H880" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="38" y="355" width="1122" height="42" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="599" y="381" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#334155">DIAGNOSE FIRST · CHANGE ONE LAYER · REPLAY THE FAILING CASES · RUN REGRESSION</text>
</g></svg>