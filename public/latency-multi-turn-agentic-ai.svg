<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" role="img" aria-labelledby="t d">
<title id="t">Latency in Multi-Turn Agentic AI</title>
<desc id="d">Production infographic explaining multi-turn agentic AI latency, TTFT, response latency, critical path, bottlenecks, percentiles and latency contracts.</desc>
<defs>
 <linearGradient id="hero" x1="0" x2="1"><stop stop-color="#07182f"/><stop offset="1" stop-color="#173b62"/></linearGradient>
 <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#e8faf5"/><stop offset="1" stop-color="#d9f3ea"/></linearGradient>
 <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#eef7ff"/><stop offset="1" stop-color="#dceeff"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".12"/></filter>
 <style>text{font-family:Inter,Arial,sans-serif;fill:#12315a}.h{font-weight:800}.m{font-weight:700}.s{font-size:20px}.xs{font-size:16px}.num{font-size:30px;font-weight:800;fill:#fff}.panel{fill:#fff;stroke:#b9d8ee;stroke-width:2}.accent{fill:#1b65a5}.green{fill:#159447}.warn{fill:#fff0dc;stroke:#efc58f}.gold{fill:#e7bf67}</style>
</defs>
<rect width="1200" height="1800" fill="#f4f8fb"/>
<rect width="1200" height="150" fill="url(#hero)"/>
<text x="42" y="58" fill="#fff" font-size="42" font-weight="800">shyena.eu</text><text x="44" y="88" fill="#d9e6f2" font-size="13" letter-spacing="3">EVALUATE. OBSERVE. ASSURE.</text>
<line x1="295" y1="28" x2="295" y2="120" stroke="#9eb6cc" stroke-width="2"/><text x="325" y="58" fill="#fff" font-size="30" font-weight="800">Latency in Multi-Turn Agentic AI</text><text x="325" y="91" fill="#8fe8de" font-size="20" font-weight="700">Why We Measure the Bot Turn, Not the User Turn</text><text x="325" y="120" fill="#dbe7f2" font-size="16">A practical approach to conversational AI assurance</text>

<!-- 1 --> <rect class="panel" x="18" y="170" width="570" height="300" rx="12" filter="url(#shadow)"/><circle cx="48" cy="200" r="22" fill="#1764a5"/><text class="num" x="39" y="211">1</text><text class="h" x="82" y="207" font-size="25">A Multi-Turn Conversation</text><text class="xs" x="82" y="232">Only bot-response turns are measured for latency</text>
<g font-size="17"><circle cx="54" cy="275" r="15" fill="#63a7df"/><text x="49" y="281" fill="#fff">1</text><text x="90" y="281">User</text><rect x="165" y="258" width="290" height="34" rx="17" fill="#dceeff"/><text x="184" y="281">Where is my parcel?</text><circle cx="54" cy="325" r="15" fill="#36b86b"/><text x="49" y="331" fill="#fff">2</text><text x="90" y="331">Bot</text><rect x="165" y="308" width="290" height="34" rx="17" fill="#dff4e8"/><text x="184" y="331">Please provide your tracking number.</text><circle cx="54" cy="375" r="15" fill="#63a7df"/><text x="49" y="381" fill="#fff">3</text><text x="90" y="381">User</text><rect x="165" y="358" width="290" height="34" rx="17" fill="#dceeff"/><text x="184" y="381">3SABC123</text><circle cx="54" cy="425" r="15" fill="#36b86b"/><text x="49" y="431" fill="#fff">4</text><text x="90" y="431">Bot</text><rect x="165" y="408" width="290" height="34" rx="17" fill="#dff4e8"/><text x="184" y="431">Your parcel is in Amsterdam.</text></g>
<rect class="warn" x="30" y="444" width="540" height="14" rx="7"/><text x="45" y="456" font-size="12" font-weight="700">User turns are inputs. Bot turns are the system's measurable response events.</text>

<!-- 2 --> <rect class="panel" x="612" y="170" width="570" height="300" rx="12" filter="url(#shadow)"/><circle cx="642" cy="200" r="22" fill="#1764a5"/><text class="num" x="633" y="211">2</text><text class="h" x="676" y="207" font-size="25">What We Measure</text><text class="xs" x="676" y="232">Bot response latency is measured from request receipt to response completion.</text>
<rect x="815" y="270" width="165" height="145" rx="12" fill="#edf7ff" stroke="#78b9ec" stroke-width="2"/><text class="m" x="846" y="292" font-size="16">Agent Execution</text><text x="835" y="322" font-size="14">Intent / Flow</text><text x="835" y="345" font-size="14">Orchestration</text><text x="835" y="368" font-size="14">LLM reasoning</text><text x="835" y="391" font-size="14">RAG + Tool/API</text><path d="M760 340h55M980 340h55" stroke="#1764a5" stroke-width="3"/><circle cx="730" cy="340" r="25" fill="#63a7df"/><circle cx="1065" cy="340" r="25" fill="#63a7df"/><text x="697" y="382" font-size="13">User message</text><text x="1028" y="382" font-size="13">Bot response</text><text class="m" x="815" y="446" font-size="16">Response latency = T1 − T0</text>

<!-- 3 --> <rect class="panel" x="18" y="490" width="570" height="300" rx="12" filter="url(#shadow)"/><circle cx="48" cy="520" r="22" fill="#1764a5"/><text class="num" x="39" y="531">3</text><text class="h" x="82" y="527" font-size="25">TTFT vs Response Latency</text><text class="xs" x="82" y="552">Two different metrics. Both are important.</text><line x1="70" y1="620" x2="530" y2="620" stroke="#9bb4c8" stroke-dasharray="6 5"/><line x1="70" y1="700" x2="530" y2="700" stroke="#9bb4c8" stroke-dasharray="6 5"/><text class="m" x="70" y="605" font-size="14">T0 Request received</text><text class="m" x="250" y="605" font-size="14">T1 First token</text><text class="m" x="420" y="605" font-size="14">T2 Complete</text><rect x="70" y="630" width="185" height="34" rx="8" fill="#65aeea"/><text x="120" y="653" fill="#fff" font-weight="800">TTFT 800 ms</text><rect x="70" y="710" width="390" height="34" rx="8" fill="#56c78a"/><text x="220" y="733" fill="#083d25" font-weight="800">Response Latency 3,000 ms</text><text x="70" y="770" font-size="15">TTFT → how quickly the agent starts responding.</text><text x="70" y="786" font-size="15">Response latency → how quickly the complete response is produced.</text>

<!-- 4 --> <rect class="panel" x="612" y="490" width="570" height="300" rx="12" filter="url(#shadow)"/><circle cx="642" cy="520" r="22" fill="#1764a5"/><text class="num" x="633" y="531">4</text><text class="h" x="676" y="527" font-size="25">Where Latency Comes From</text><text class="xs" x="676" y="552">A single latency number doesn't tell the full story.</text><rect x="650" y="610" width="80" height="45" rx="6" fill="#dceeff"/><rect x="730" y="610" width="150" height="45" rx="6" fill="#dceeff"/><rect x="880" y="610" width="90" height="45" rx="6" fill="#fff0d7"/><rect x="970" y="610" width="145" height="45" rx="6" fill="#ffd9d9"/><rect x="1115" y="610" width="45" height="45" rx="6" fill="#dff4e8"/><text x="670" y="638" font-size="14">0.4s</text><text x="775" y="638" font-size="14">1.9s LLM</text><text x="900" y="638" font-size="14">0.8s RAG</text><text x="995" y="638" font-size="14">2.1s API</text><text x="1118" y="638" font-size="12">0.6</text><text class="m" x="690" y="690" font-size="18">End-to-End Bot Latency: 5.8 sec</text><rect class="warn" x="650" y="715" width="510" height="50" rx="8"/><text x="670" y="737" font-size="14" font-weight="700">Primary bottleneck: Customer API (2.1 sec)</text><text x="670" y="755" font-size="13">Trace the component-level contribution before optimising.</text>

<!-- 5 --> <rect class="panel" x="18" y="810" width="570" height="255" rx="12" filter="url(#shadow)"/><circle cx="48" cy="840" r="22" fill="#1764a5"/><text class="num" x="39" y="851">5</text><text class="h" x="82" y="847" font-size="25">Sequential vs Parallel Tool Execution</text><text class="xs" x="82" y="872">Latency should follow the critical path, not every span added together.</text><rect x="55" y="910" width="225" height="75" rx="10" fill="#fff0f0" stroke="#e99"/><text x="80" y="935" class="m" font-size="16">Sequential</text><text x="80" y="960" font-size="14">800 + 1,200 = 2,000 ms</text><rect x="315" y="910" width="225" height="75" rx="10" fill="url(#mint)" stroke="#9dd"/><text x="340" y="935" class="m" font-size="16">Parallel</text><text x="340" y="960" font-size="14">max(800, 1,200) = 1,200 ms</text>

<!-- 6 --> <rect class="panel" x="612" y="810" width="570" height="255" rx="12" filter="url(#shadow)"/><circle cx="642" cy="840" r="22" fill="#1764a5"/><text class="num" x="633" y="851">6</text><text class="h" x="676" y="847" font-size="25">Latency Across Turns</text><text class="xs" x="676" y="872">Latency varies by turn complexity.</text><line x1="670" y1="1015" x2="1135" y2="1015" stroke="#b8c8d5"/><g fill="#4d9ce2"><rect x="680" y="970" width="45" height="45"/><rect x="760" y="915" width="45" height="100"/><rect x="840" y="955" width="45" height="60"/><rect x="920" y="885" width="45" height="130"/><rect x="1000" y="975" width="45" height="40"/><rect x="1080" y="940" width="45" height="75"/></g><g font-size="13"><text x="684" y="1035">T1</text><text x="764" y="1035">T2</text><text x="844" y="1035">T3</text><text x="924" y="1035">T4</text><text x="1004" y="1035">T5</text><text x="1084" y="1035">T6</text></g>

<!-- 7 --> <rect class="panel" x="18" y="1085" width="570" height="255" rx="12" filter="url(#shadow)"/><circle cx="48" cy="1115" r="22" fill="#1764a5"/><text class="num" x="39" y="1126">7</text><text class="h" x="82" y="1122" font-size="25">Latency Distribution Matters</text><text class="xs" x="82" y="1147">Average latency can hide the tail experience.</text><g font-size="17"><rect x="70" y="1180" width="100" height="48" fill="#edf7ff"/><rect x="180" y="1180" width="100" height="48" fill="#edf7ff"/><rect x="290" y="1180" width="100" height="48" fill="#edf7ff"/><rect x="400" y="1180" width="100" height="48" fill="#edf7ff"/><text x="92" y="1210">P50 1.5s</text><text x="202" y="1210">P90 3.2s</text><text x="312" y="1210">P95 4.2s</text><text x="422" y="1210">P99 9.8s</text></g><rect class="warn" x="70" y="1250" width="430" height="55" rx="8"/><text x="88" y="1273" font-size="14" font-weight="700">Tail latency matters.</text><text x="88" y="1293" font-size="13">Users on P99 can experience a completely different journey.</text>

<!-- 8 --> <rect class="panel" x="612" y="1085" width="570" height="255" rx="12" filter="url(#shadow)"/><circle cx="642" cy="1115" r="22" fill="#1764a5"/><text class="num" x="633" y="1126">8</text><text class="h" x="676" y="1122" font-size="25">Latency Contract</text><text class="xs" x="676" y="1147">Define expectations per conversational journey.</text><rect x="650" y="1170" width="510" height="130" rx="8" fill="#0c1830"/><text x="675" y="1200" fill="#9ee9d6" font-family="monospace" font-size="16">latency_contract:</text><text x="675" y="1225" fill="#fff" font-family="monospace" font-size="15">response: target 3s</text><text x="675" y="1248" fill="#fff" font-family="monospace" font-size="15">warning 5s</text><text x="675" y="1271" fill="#fff" font-family="monospace" font-size="15">failure 6s</text>

<!-- 9 --> <rect class="panel" x="18" y="1360" width="570" height="250" rx="12" filter="url(#shadow)"/><circle cx="48" cy="1390" r="22" fill="#1764a5"/><text class="num" x="39" y="1401">9</text><text class="h" x="82" y="1397" font-size="25">Sample Output</text><text class="xs" x="82" y="1422">Make latency actionable AI assurance.</text><text x="70" y="1470" class="m" font-size="18">Latency Score</text><text x="430" y="1470" class="m" font-size="18" fill="#159447">82 / 100</text><text x="70" y="1500" font-size="16">Verdict</text><text x="430" y="1500" font-size="16" fill="#c87900">WARN</text><text x="70" y="1530" font-size="16">Actual</text><text x="430" y="1530" font-size="16">4.6 sec</text><text x="70" y="1560" font-size="16">Primary bottleneck</text><text x="300" y="1560" font-size="16" font-weight="700">Customer API</text>

<!-- 10 --> <rect class="panel" x="612" y="1360" width="570" height="250" rx="12" filter="url(#shadow)"/><circle cx="642" cy="1390" r="22" fill="#1764a5"/><text class="num" x="633" y="1401">10</text><text class="h" x="676" y="1397" font-size="25">Evaluation Model</text><text class="xs" x="676" y="1422">Latency works alongside other evaluation skills.</text><g font-size="15"><rect x="650" y="1460" width="145" height="32" rx="16" fill="#e6f5ff"/><text x="678" y="1482">Deterministic Skill</text><rect x="650" y="1500" width="145" height="32" rx="16" fill="#e6f5ff"/><text x="678" y="1522">Semantic Skill</text><rect x="650" y="1540" width="145" height="32" rx="16" fill="#e6f5ff"/><text x="678" y="1562">Orchestrator Skill</text><rect x="825" y="1460" width="145" height="32" rx="16" fill="#e8faf5"/><text x="853" y="1482">RAG Quality</text><rect x="825" y="1500" width="145" height="32" rx="16" fill="#e8faf5"/><text x="853" y="1522">Security Skill</text><rect x="825" y="1540" width="145" height="32" rx="16" fill="#fff0d7"/><text x="853" y="1562">Latency Skill</text><rect x="1000" y="1460" width="145" height="32" rx="16" fill="#fff0d7"/><text x="1028" y="1482">Production Monitor</text></g>

<rect y="1640" width="1200" height="160" fill="url(#hero)"/><text x="55" y="1695" fill="#fff" font-size="26" font-style="italic">“How long did the agent take to respond to each user request —</text><text x="55" y="1730" fill="#fff" font-size="26" font-style="italic">and what happened inside the agent during that response?”</text><text x="965" y="1720" fill="#fff" font-size="34" font-weight="800">shyena.eu</text><text x="968" y="1748" fill="#d9e6f2" font-size="11" letter-spacing="2">FROM CONVERSATIONS TO CONFIDENCE.</text>
</svg>